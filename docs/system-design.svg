<text x="80" y="1306" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Traces + redacted logs + infrastructure metrics + queue health + model cost + quality indicators</text>
<text x="80" y="1335" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Separate restricted audit trail; persist mandatory write audit atomically. No raw prompt logging by default.</text>
<rect x="60" y="1370" width="1680" height="120" rx="12" fill="#fff3dc" stroke="#d4ae66" stroke-width="2"/>
<text x="80" y="1411" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Governance and release controls — outside the synchronous request path</text>
<text x="80" y="1446" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Offline / adversarial evals → release approval → canary + rollback | risk register | retention + residency</text>
<text x="80" y="1475" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Secrets + workload identity | least privilege | restore drills | incident runbooks | write / tool / model kill switches</text>
<text x="60" y="1540" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Phase two: statements • address changes • cheque-book requests • KYC intake, each with separate activation gates.</text>
<text x="60" y="1568" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506680">Solid arrows: runtime flow. Dashed: policy/control or asynchronous integration. Boxes are logical responsibilities.</text>
